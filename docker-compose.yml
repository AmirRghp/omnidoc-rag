name: omnidoc-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: omnidoc-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omnidoc-network

  redis:
    image: redis:7-alpine
    container_name: omnidoc-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - omnidoc-network

  postgres:
    image: postgres:16-alpine
    container_name: omnidoc-rag-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-54321}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnidoc_password}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnidoc} -d ${POSTGRES_DB:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omnidoc-network

  langfuse:
    image: langfuse/langfuse:2
    container_name: omnidoc-rag-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3003}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-omnidoc}:${POSTGRES_PASSWORD:-omnidoc_password}@postgres:5432/${POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3003}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-default_secret_for_local_dev_only_change_in_prod}
      SALT: ${LANGFUSE_SALT:-default_salt_for_local_dev_only_change_in_prod}
      TELEMETRY_ENABLED: "false"
    networks:
      - omnidoc-network

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  omnidoc-network:
    driver: bridge
